name: Bug report
description: A skill or script did something wrong or crashed
labels: [bug]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options: [bash-checkpoint, brave-cdp, cf-pages-deploy, claude-md-doctor, claude-safety-audit, claude-sandbox, claude-token-audit, env-doctor, event-recap-video, freelance-proposal, gif-maker, itch-html5-package, link-preview-check, mcp-audit, package-guard, read-guard, readme-upgrade, release-notes, secret-commit-guard, session-handoff, site-qa, thumbnail-maker, visual-diff]
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows (Git Bash), Windows (PowerShell), WSL, Other]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `node --version` (and `python --version` / `ffmpeg -version` if the skill uses them)
      placeholder: "node v22.11.0"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      description: The exact command, or what you asked Claude to do
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What happened
      description: Paste the output. Remove any secrets, tokens or private paths first.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
