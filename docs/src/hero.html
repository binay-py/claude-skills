<!doctype html>
<!-- README hero banner. Render: node skills/gif-maker/scripts/gif.mjs html docs/src/hero.html --dur 6 --size 960x340 --fps 20 --out docs/hero.gif -->
<meta charset="utf-8">
<style>
  :root { --dur: 6s; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(900px 420px at 15% 0%, #3b1d5e 0%, transparent 60%),
                radial-gradient(700px 380px at 100% 100%, #5c2a12 0%, transparent 60%), #0d1117;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: #e6edf3; overflow: hidden;
  }
  .wrap { position: absolute; inset: 0; padding: 34px 44px; box-sizing: border-box; }
  h1 { margin: 0; font-size: 62px; font-weight: 900; letter-spacing: -1.5px; line-height: 1;
       background: linear-gradient(90deg, #ffb347, #ff6a88 45%, #a78bfa); -webkit-background-clip: text; color: transparent;
       animation: rise var(--dur) cubic-bezier(.2,.9,.3,1.2) infinite; }
  .sub { margin-top: 10px; font-size: 22px; color: #9da7b3; animation: rise var(--dur) .12s cubic-bezier(.2,.9,.3,1.2) infinite both; }
  .sub b { color: #e6edf3; }
  .rows { margin-top: 26px; display: grid; gap: 12px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .tag { width: 92px; flex: none; font-weight: 800; font-size: 15px; letter-spacing: .5px; text-transform: uppercase; }
  .chip { padding: 7px 13px; border-radius: 999px; font: 600 15px "Cascadia Mono", Consolas, "SF Mono", monospace;
          background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); white-space: nowrap;
          animation: pop var(--dur) cubic-bezier(.2,1.5,.4,1) infinite both; }
  .safe .tag { color: #3fb950 } .safe .chip { border-color: rgba(63,185,80,.45); }
  .cheap .tag { color: #f2cc60 } .cheap .chip { border-color: rgba(242,204,96,.45); }
  .ship .tag { color: #79c0ff } .ship .chip { border-color: rgba(121,192,255,.45); }
  /* each element appears at its own delay, stays, and everything fades out together so the loop is seamless */
  @keyframes rise { 0% { opacity: 0; transform: translateY(14px) } 8%, 90% { opacity: 1; transform: none } 100% { opacity: 0 } }
  @keyframes pop  { 0% { opacity: 0; transform: scale(.6) } 7%, 90% { opacity: 1; transform: none } 100% { opacity: 0 } }
</style>
<div class="wrap">
  <h1>claude-skills</h1>
  <div class="sub"><b>23 tested skills</b> that keep Claude Code safe and cheap, and help you ship.</div>
  <div class="rows">
    <div class="row safe"><span class="tag">🛡 Safe</span>
      <span class="chip">safety-audit</span><span class="chip">bash-checkpoint</span><span class="chip">sandbox</span><span class="chip">package-guard</span><span class="chip">secret-guard</span></div>
    <div class="row cheap"><span class="tag">⚡ Cheap</span>
      <span class="chip">token-audit</span><span class="chip">read-guard</span><span class="chip">handoff</span><span class="chip">mcp-audit</span><span class="chip">md-doctor</span></div>
    <div class="row ship"><span class="tag">🚀 Ship</span>
      <span class="chip">site-qa</span><span class="chip">link-preview</span><span class="chip">visual-diff</span><span class="chip">cf-deploy</span><span class="chip">gif-maker</span><span class="chip">+8</span></div>
  </div>
</div>
<script>
  // stagger: rows then chips, ~70 ms apart (delays are part of the loop, so the GIF still loops cleanly)
  let i = 0;
  for (const c of document.querySelectorAll('.chip')) c.style.animationDelay = (0.45 + (i++) * 0.07) + 's';
  document.querySelectorAll('.tag').forEach((t, k) => { t.style.animation = `rise var(--dur) ${0.3 + k * 0.1}s cubic-bezier(.2,.9,.3,1.2) infinite both`; });
</script>
